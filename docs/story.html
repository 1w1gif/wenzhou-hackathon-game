<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10121b" />
  <title>衍月·八相 | 中秋满月 · 观星塔之约</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; background: #10121b; }
    body { color: #e8dfc8; font-family: 'STKaiti', 'KaiTi', 'Noto Serif SC', serif; }

    .stage {
      position: relative; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 9vh 22px calc(56px + env(safe-area-inset-bottom));
      background-color: #0d1018;
      background-image:
        linear-gradient(180deg, rgba(11,13,20,.55) 0%, rgba(11,13,20,.42) 14%, rgba(11,13,20,.9) 40%, #0d1018 62%),
        url('assets/bg/night_forest_gold.png');
      background-repeat: no-repeat, no-repeat;
      background-size: 100% 100%, 100% auto;
      background-position: center top, center top;
      overflow: hidden;
    }
    .stage::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 12%, rgba(247,243,228,.10), transparent 46%);
    }
    .moon-glow {
      position: absolute; z-index: 1; top: 3%; left: 50%; transform: translateX(-50%);
      width: clamp(110px, 30vw, 210px); height: clamp(110px, 30vw, 210px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(242,231,200,.5), rgba(242,231,200,0) 70%);
      animation: breathe 5.5s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100% { transform: translateX(-50%) scale(1); opacity:.6 } 50% { transform: translateX(-50%) scale(1.1); opacity:.95 } }

    .card {
      position: relative; z-index: 2; width: 100%; max-width: 640px;
      text-align: center; padding: 0 4px;
    }
    h1 {
      font-size: clamp(42px, 9vw, 80px);
      letter-spacing: .18em; color: #f2e7c8; font-weight: 600;
      text-shadow: 0 0 32px rgba(197,238,240,.35), 0 2px 6px rgba(0,0,0,.8);
    }
    .sub {
      margin-top: 12px; font-size: clamp(13px, 2.6vw, 18px);
      letter-spacing: .32em; color: #c5eef0; opacity: .9;
    }
    .divider {
      margin: 26px auto 24px; width: min(360px, 68vw); height: 1px;
      background: linear-gradient(90deg, transparent, #d6a85d, transparent);
    }

    .story {
      font-size: clamp(14px, 3.2vw, 16px);
      line-height: 2.05; letter-spacing: .06em;
      color: #e3dac4; text-align: left;
      max-height: 40dvh; overflow-y: auto;
      padding: 2px 10px 2px 2px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      mask-image: linear-gradient(180deg, #000 82%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent 100%);
    }
    .story p { margin-bottom: 12px; opacity: .92; }
    .story p:last-child { margin-bottom: 0; }
    .story .hi { color: #f0e2b8; }

    .cta {
      position: relative; z-index: 2;
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 30px; padding: 15px 44px;
      font-family: inherit; font-size: clamp(16px, 3.6vw, 19px);
      letter-spacing: .3em; text-indent: .3em;
      color: #241f18; text-decoration: none; font-weight: 600;
      background: linear-gradient(180deg, #e4c07a, #c9a05c);
      border: 1.5px solid #8d6a34; border-radius: 999px;
      box-shadow: 0 6px 0 rgba(0,0,0,.55), 0 0 34px rgba(201,160,92,.35);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .cta:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 20px rgba(201,160,92,.3); }

    .hint {
      position: relative; z-index: 2; margin-top: 16px;
      font-size: 12px; letter-spacing: .2em; color: #a39b86; opacity: .85;
      display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    }
    .team {
      position: relative; z-index: 2; margin-top: 34px;
      font-size: 11px; letter-spacing: .28em; color: #b9b19e; opacity: .6;
    }
    @media (max-height: 620px) {
      .stage { padding-top: 4vh; }
      .story { max-height: 32dvh; }
      .cta { margin-top: 20px; padding: 12px 36px; }
      .team { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="moon-glow"></div>
    <div class="card">
      <h1>衍月·八相</h1>
      <div class="sub">中秋满月 · 观星塔之约</div>
      <div class="divider"></div>
      <div class="story">
        <p>中秋之夜，满月高悬。古镇灯火通明，衍月与沈砚相约观星塔顶，共赏一年中最圆的月亮。</p>
        <p>火光骤起，强盗夜袭观星塔。刀光打破古镇的宁静，两人被逼上塔顶。</p>
        <p>刀锋落下的瞬间，沈砚挡在了她的身前。</p>
        <p>满月之下，沈砚在她怀中闭上了眼睛。她连一句告别，都没能说完。</p>
        <p>遗物「月相轮」在月光中苏醒。逆转时光的力量——<span class="hi">代价，是燃烧她的生命</span>。</p>
        <p>时光倒回中秋之夜。满月依旧升起，而重活的沈砚，已不再记得她。为了让沈砚恢复记忆，衍月决定去观星塔里寻找线索……</p>
      </div>
    </div>
    <a class="cta" href="game-dora/">进 入 游 戏</a>
    <div class="hint"><span>手机横屏体验更佳</span><span>·</span><span>支持触屏操作</span><span>·</span><span><a href="game/" style="color:#a39b86">网页原型版</a></span></div>
    <div class="team">INTERCITY HACK 2026 · 温州场</div>
  </div>
</body>
</html>
