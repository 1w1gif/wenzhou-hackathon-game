<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10121b" />
  <title>衍月·八相</title>
  <script>
    // 二维码跳转层：重定向到主入口 hackathon-game-dora.pages.dev（扫码域名不换，入口可随时切换）
    (function () {
      var target = 'https://hackathon-game-dora.pages.dev/';
      try {
        var params = new URLSearchParams(location.search);
        if (params.has('story')) { location.replace('story.html'); return; }
      } catch (e) { /* 忽略，正常跳转 */ }
      location.replace(target);
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #10121b; }
    body { display: grid; place-items: center; }
    a { color: #c9a05c; font-family: 'STKaiti', 'KaiTi', serif; letter-spacing: .2em; }
  </style>
</head>
<body>
  <a href="https://hackathon-game-dora.pages.dev/">进入游戏…</a>
</body>
</html>
